<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiattikhun Hub - Get Key</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border border-gray-700">
        <h1 class="text-2xl font-bold mb-2 text-cyan-400">🚀 Kiattikhun Hub</h1>
        <p class="text-gray-400 mb-6 text-sm">ระบบรับคีย์ประจำวัน (Key Gateway)</p>
        
        <div class="bg-gray-900 p-4 rounded-xl border border-gray-700 mb-6">
            <p class="text-xs text-gray-500 mb-1">คีย์ของคุณวันนี้คือ:</p>
            <div id="key-display" class="text-xl font-mono font-bold text-green-400 tracking-wider">กำลังสร้างคีย์...</div>
        </div>

        <button onclick="copyKey()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-lg">
            คัดลอกคีย์ (Copy Key)
        </button>
        <p id="status" class="text-xs text-green-400 mt-3 hidden">คัดลอกคีย์เรียบร้อยแล้ว!</p>
    </div>

    <script>
        function generateTodayKey() {
            const d = new Date();
            const year = d.getUTCFullYear();
            const month = String(d.getUTCMonth() + 1).padStart(2, '0');
            const day = String(d.getUTCDate()).padStart(2, '0');
            
            const code = (parseInt(year) * parseInt(month)) + (parseInt(day) * 88) + 5555;
            return `KHUB-${year}${month}${day}-${code}`;
        }

        const todayKey = generateTodayKey();
        document.getElementById('key-display').innerText = todayKey;

        function copyKey() {
            navigator.clipboard.writeText(todayKey);
            const status = document.getElementById('status');
            status.classList.remove('hidden');
            setTimeout(() => status.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
